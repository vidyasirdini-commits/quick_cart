name: QuickCart CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quickcart_user
          POSTGRES_PASSWORD: quickcart_pass
          POSTGRES_DB: quickcart_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm install

      - name: Generate Prisma Client
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://quickcart_user:quickcart_pass@localhost:5432/quickcart_db?schema=public
        run: npx prisma generate

      - name: Run Backend Integration & State Machine Tests
        working-directory: ./server
        env:
          NODE_ENV: test
          JWT_SECRET: super_ci_secret_jwt_key
          DATABASE_URL: postgresql://quickcart_user:quickcart_pass@localhost:5432/quickcart_db?schema=public
        run: npm test

      - name: Build Frontend Application (Vite & Tailwind)
        working-directory: ./client
        run: npm run build
