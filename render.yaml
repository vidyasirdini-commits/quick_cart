services:
  # QuickCart Express Backend API
  - type: web
    name: quickcart-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: quickcart-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://quickcart.vercel.app
    healthCheckPath: /api/health

databases:
  # QuickCart PostgreSQL Instance
  - name: quickcart-db
    databaseName: quickcart_prod
    user: quickcart_admin
    plan: free
